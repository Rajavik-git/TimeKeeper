      "get": {
        "summary": "Read local application state",
        "operationId": "state_get",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/State" } }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/Error" } }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/json": { "schema": { "$ref": "#/components/schemas/Error" } }
            }
          }
        },
        "parameters": [
          { "name": "date", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "clientId", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "caseId", "in": "query", "required": false, "schema": { "type": "string" } },
          {
            "name": "timeZone",
            "in": "query",
            "schema": { "type": "string" },
            "description": "IANA calendar timezone. Defaults to the desktop system timezone. Periods belong to their start day; durations are not split or clipped."
          }
        ],
        "deprecated": true,
        "description": "Retained compatibility API. Current screens use canonical catalog, work-period, source, audit, and billing contracts. "
      }
    },
