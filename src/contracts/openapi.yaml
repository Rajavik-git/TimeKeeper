                          "internal",
                          "admin"
                        ]
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "label": {
                    "type": "string"
                  },
                  "review_status": {
                    "type": "string",
                    "enum": [
                      "approved"
                    ]
                  }
                },
                "required": []
              }
            }
          }
        },
