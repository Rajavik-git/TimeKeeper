          "id": { "type": "string", "minLength": 1 },
          "expectedEffectiveRevision": { "type": "integer", "minimum": 0 }
        }
      },
      "FailedInboxCommand": {
        "type": "object",
        "additionalProperties": false,
        "required": ["file", "kind", "sessionId", "occurredAt", "error", "message"],
        "properties": {
          "file": { "type": "string" },
          "kind": { "type": ["string", "null"], "enum": ["start", "end", null] },
          "sessionId": { "type": ["string", "null"] },
          "occurredAt": { "type": ["string", "null"] },
          "error": { "type": "string" },
          "message": { "type": "string" }
        }
      },
      "ScreenpipeSyncRun": {
        "type": "object",
        "additionalProperties": false,
        "description": "Most recent bounded import batch since backend startup. Success does not prove complete provider history.",
        "required": [
          "outcome",
          "startedAt",
          "finishedAt",
          "windows",
          "imported",
          "unchanged",
          "preserved",
          "error"
        ],
        "properties": {
          "outcome": {
            "type": "string",
            "enum": ["succeeded", "partial", "failed", "no-sessions", "not-configured"]
          },
          "startedAt": { "type": "string", "format": "date-time" },
          "finishedAt": { "type": "string", "format": "date-time" },
          "windows": { "type": "integer", "minimum": 0 },
          "imported": { "type": "integer", "minimum": 0 },
          "unchanged": { "type": "integer", "minimum": 0 },
          "preserved": { "type": "integer", "minimum": 0 },
          "error": {
            "type": ["string", "null"],
            "enum": [
              "authentication-failed",
              "unavailable",
              "incomplete",
              "internal",
              "not-configured",
              null
            ]
          },
          "updated": { "type": "integer", "minimum": 0 }
        }
      },
      "ScreenpipeIntegrationStatus": {
        "type": "object",
        "additionalProperties": false,
        "description": "Runtime diagnostics since backend startup. Configuration is server-owned. No credentials or recording content are returned.",
        "required": [
          "configured",
          "configurationIssue",
          "automaticSync",
          "intervalSeconds",
          "syncing",
          "testing",
          "connection",
          "lastRun",
          "lastSuccessfulSyncAt"
        ],
        "properties": {
          "configured": { "type": "boolean" },
          "configurationIssue": {
            "type": ["string", "null"],
            "enum": ["missing-api-key", "invalid-url", null]
          },
          "automaticSync": {
            "type": "boolean",
            "description": "Whether automatic import is enabled. Authentication failure pauses retries."
          },
          "intervalSeconds": { "type": "integer", "minimum": 1 },
          "syncing": { "type": "boolean" },
          "testing": { "type": "boolean" },
          "connection": {
            "type": "object",
            "additionalProperties": false,
            "required": ["status", "checkedAt", "message"],
            "properties": {
              "status": {
                "type": "string",
                "enum": [
                  "not-tested",
                  "not-configured",
                  "connected",
                  "authentication-failed",
                  "unavailable",
                  "error"
                ]
              },
              "checkedAt": { "type": ["string", "null"], "format": "date-time" },
              "message": {
                "type": ["string", "null"],
                "description": "Sanitized explanation. Never contains credentials or provider response bodies."
              }
            }
          },
          "lastRun": {
            "anyOf": [{ "$ref": "#/components/schemas/ScreenpipeSyncRun" }, { "type": "null" }]
          },
          "lastSuccessfulSyncAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "ScreenpipeActionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties": {}
      },
      "HistoryFailure": {
        "type": "string",
        "enum": [
          "dispatch-failed",
          "workflow-failed",
          "inference-failed",
          "stale-snapshot",
          "expired",
          "not-configured",
          "history-too-large"
        ]
      },
      "HistoryJob": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": { "type": "string" },
          "sessionId": { "type": "string" },
          "startAt": { "type": "string", "format": "date-time" },
          "endAt": { "type": "string", "format": "date-time" },
          "createdAt": { "type": "string", "format": "date-time" },
          "finishedAt": { "type": ["string", "null"], "format": "date-time" },
          "status": {
            "type": "string",
            "enum": [
              "dispatching",
              "dispatched",
              "dispatch-unconfirmed",
              "running",
              "ready",
              "failed",
              "expired"
            ]
          },
          "error": {
            "type": ["string", "null"],
            "enum": [
              null,
              "dispatch-failed",
              "workflow-failed",
              "inference-failed",
              "stale-snapshot",
              "expired",
              "not-configured",
              "history-too-large"
            ]
          },
          "sourceCount": { "type": "integer", "minimum": 0 },
          "proposalCount": { "type": "integer", "minimum": 0 }
        },
        "required": [
          "id",
          "sessionId",
          "startAt",
          "endAt",
          "createdAt",
          "finishedAt",
          "status",
          "error",
          "sourceCount",
          "proposalCount"
        ]
      },
      "HistoryProposalInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "caseId": { "type": ["string", "null"] },
          "startedAt": { "type": "string", "format": "date-time" },
          "endedAt": { "type": "string", "format": "date-time" },
          "label": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "confidence": { "type": ["number", "null"], "minimum": 0, "maximum": 1 },
          "sourceIds": {
            "type": "array",
            "items": { "type": "string", "minLength": 1 },
            "minItems": 1,
            "maxItems": 10000,
            "uniqueItems": true
          },
          "hasGaps": { "type": "boolean" }
        },
        "required": [
          "caseId",
          "startedAt",
          "endedAt",
          "label",
          "confidence",
          "sourceIds",
          "hasGaps"
        ]
      },
      "HistoryProposal": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "caseId": { "type": ["string", "null"] },
          "startedAt": { "type": "string", "format": "date-time" },
          "endedAt": { "type": "string", "format": "date-time" },
          "label": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "confidence": { "type": ["number", "null"], "minimum": 0, "maximum": 1 },
          "sourceIds": {
            "type": "array",
            "items": { "type": "string", "minLength": 1 },
            "minItems": 1,
            "maxItems": 10000,
            "uniqueItems": true
          },
          "hasGaps": { "type": "boolean" },
          "id": { "type": "string" },
          "jobId": { "type": "string" },
          "sessionId": { "type": "string" },
          "revision": { "type": "integer", "minimum": 0 },
          "status": { "type": "string", "enum": ["draft", "accepted", "rejected"] },
          "acceptedPeriodId": { "type": ["string", "null"] }
        },
        "required": [
          "caseId",
          "startedAt",
          "endedAt",
          "label",
          "confidence",
          "sourceIds",
          "hasGaps",
          "id",
          "jobId",
          "sessionId",
          "revision",
          "status",
          "acceptedPeriodId"
        ]
      },
      "HistoryCase": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": { "type": "string" },
          "clientId": { "type": "string" },
          "reference": { "type": "string" },
          "title": { "type": "string" },
          "clientName": { "type": "string" }
        },
        "required": ["id", "clientId", "reference", "title", "clientName"]
      },
      "HistoryState": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "configured": { "type": "boolean" },
          "jobs": { "type": "array", "items": { "$ref": "#/components/schemas/HistoryJob" } },
          "proposals": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/HistoryProposal" }
          }
        },
        "required": ["configured", "jobs", "proposals"]
      },
      "HistoryGenerateRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "sessionId": { "type": "string", "minLength": 1 },
          "startAt": { "type": "string", "format": "date-time" },
          "endAt": { "type": "string", "format": "date-time" }
        },
        "required": ["sessionId", "startAt", "endAt"]
      },
      "HistoryClaim": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "job": { "$ref": "#/components/schemas/HistoryJob" },
          "claimId": { "type": "string" },
          "session": { "$ref": "#/components/schemas/Session" },
          "sources": { "type": "array", "items": { "$ref": "#/components/schemas/PeriodSource" } },
          "cases": { "type": "array", "items": { "$ref": "#/components/schemas/HistoryCase" } }
        },
        "required": ["job", "claimId", "session", "sources", "cases"]
      },
      "HistoryCompleteRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "claimId": { "type": "string", "minLength": 1 },
          "proposals": {
            "type": "array",
            "maxItems": 100,
            "items": { "$ref": "#/components/schemas/HistoryProposalInput" }
          }
        },
        "required": ["claimId", "proposals"]
      },
      "HistoryFailRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "claimId": { "type": "string", "minLength": 1 },
          "error": { "$ref": "#/components/schemas/HistoryFailure" }
        },
        "required": ["claimId", "error"]
      },
      "HistoryAcceptRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "expectedRevision": { "type": "integer", "minimum": 0 },
          "caseId": { "type": ["string", "null"] },
          "startedAt": { "type": "string", "format": "date-time" },
          "endedAt": { "type": "string", "format": "date-time" },
          "label": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "durationMs": { "type": "integer", "minimum": 1, "maximum": 9007199254740991 }
        },
        "required": ["expectedRevision", "caseId", "startedAt", "endedAt", "label", "durationMs"]
      },
      "HistoryAcceptResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "proposal": { "$ref": "#/components/schemas/HistoryProposal" },
          "period": { "$ref": "#/components/schemas/WorkPeriod" }
        },
        "required": ["proposal", "period"]
      },
      "HistoryRejectRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": { "expectedRevision": { "type": "integer", "minimum": 0 } },
        "required": ["expectedRevision"]
      }
    }
  }
}
