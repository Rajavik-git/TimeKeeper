      "CreateCatalogMarkerRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["caseId", "type", "value"],
        "properties": {
          "caseId": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "reference",
              "case_number",
              "opposing_party",
              "client_name",
              "file",
              "email",
              "domain",
              "keyword"
            ]
          },
          "value": {
            "type": "string"
          },
          "weight": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          }
        }
      },
      "CreateCatalogClientRuleRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["clientId", "type"],
        "properties": {
          "clientId": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": ["daily_research_cap", "nonbillable_travel"]
          },
          "value": {
            "type": "integer"
          }
        }
      },
      "CanonicalSourcePackRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["scope", "options"],
        "properties": {
          "scope": {
            "type": "string",
            "enum": ["invoice", "case", "dateRange", "selectedPeriods"]
          },
          "options": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": ["blur", "personal", "audio", "audit"]
            },
            "uniqueItems": true
          },
          "invoiceId": {
            "type": "integer",
            "minimum": 1
          },
          "from": {
            "type": "string",
            "format": "date"
          },
          "to": {
            "type": "string",
            "format": "date"
          },
          "periodIds": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1
            },
            "uniqueItems": true
          },
          "timeZone": {
            "type": "string"
          }
        }
      },
      "SourceExportReceipt": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "periodIds", "options", "sha256", "createdAt"],
        "properties": {
          "id": {
            "type": "integer"
          },
          "periodIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "options": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "sha256": {
            "type": "string"
          },
          "createdAt": {
            "type": "string"
          }
        }
      },
      "CanonicalSourcePackResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["export", "payload"],
        "properties": {
          "export": {
            "$ref": "#/components/schemas/SourceExportReceipt"
          },
          "payload": {
            "type": "string",
            "description": "Version 2 JSON snapshot using canonical period and source identities, exact milliseconds, and the selected timezone. Receipt SHA-256 hashes this exact string."
          }
        }
      }
    }
  }
}
