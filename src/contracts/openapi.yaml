          "501": {
            "description": "Manual entry through the legacy route is unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["error", "message"],
                  "properties": {
                    "error": {
                      "type": "string",
                      "enum": ["unavailable"]
