name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The full test suite is not run here: setup.test.mjs and comparison-samples
      # currently fail on Windows runners (CRLF checkout, slow timeout).
      - run: npm run typecheck
      # desktop:build creates and smoke-checks the SEA (or bundled Node fallback)
      # before Tauri packages both the binary and standalone API resource.
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: timekeeper-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
